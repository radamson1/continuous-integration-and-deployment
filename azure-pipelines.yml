# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

variables:
  - name: python_version
    value: '3.12'

trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Testing
    jobs:
      - job: Testing
        continueOnError: false
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: ${{ variables.python_version }}
              addToPath: true
              architecture: 'x64'

          # Script to create virtual environment and install dependencies
          - script: |
              python3 -m venv .venv
              source .venv/bin/activate
              pip install -r requirements.txt
              pip install pytest pytest-azurepipelines
              pytest
            displayName: 'pytest'

          # Remove the virtual environment before packaging the app
          - script: rm -rf .venv
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            displayName: 'Remove local venv before packaging'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'package'
              publishLocation: 'Container'

  - stage: Deploy
    dependsOn: Testing
    jobs:
      - deployment: Deploy
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    buildType: 'current'
                    itemPattern: 'package/*.zip'
                    targetPath: '$(Pipeline.Workspace)'

                - task: AzureRmWebAppDeployment@4
                  inputs:
                    ConnectionType: 'AzureRM'
                    azureSubscription: 'azure_sub'
                    appType: 'webAppLinux'
                    WebAppName: 'UNIQUE-flask'
                    packageForLinux: '$(Pipeline.Workspace)/package/*.zip'
                    StartupCommand: 'flask db upgrade && gunicorn -w 4 -b 0.0.0.0:8000 app:app'
                    AppSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT true -WEBSITE_ENABLE_SYNC_UPDATE_SITE true'
