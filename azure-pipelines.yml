# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

variables:
  - name: python_version
    value: '<python-version-value>' # TODO 1 Replace python-version-value with 3.12

trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Testing
    jobs:
      - job: Testing
        continueOnError: false
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: ${{ variables.<python-variable-name> }} # TODO 2: Replace <python-variable-name> with the variable declared at the top. That is, the variable name used for the version of python to use
              addToPath: true
              architecture: 'x64'
          
          # Script to create virtual environment and install dependencies
          - script: |
              python3 -m venv .venv
              source .venv/bin/activate
              pip install -r requirements.txt
              pip install pytest pytest-azurepipelines
              pytest
            displayName: 'pytest'

          # Remove the virtual environment before packaging the app
          - script: rm -rf .venv
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            displayName: 'Remove local venv before packaging'
          
          # TODO 3:  Archive Files
          # Copy the ArchiveFiles@2 task from the "PUBLISHING THE BUILD ARTIFACTS" task and paste it under this comment block.
          # Please do NOT make any changes to this task.

          
          
          # TODO: 4 Publish Build Artifact
          # Copy the PublishBuildArtifacts@1 task from the "PUBLISHING THE BUILD ARTIFACTS" task and paste it under this comment block.
          # Please do NOT make any changes to this task.

          


  - stage: Deploy
    dependsOn: Testing
    jobs:
      - deployment: Deploy
        environment: 'production'
        strategy:
